<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPEUP — Преміальний вейп-шоп</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --accent-color: #9d4edd;
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --border-color: #2a2a30;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 40px auto; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: var(--accent-color); }
        .slogan { color: var(--text-muted); font-style: italic; }
        .catalog-section { max-width: 1200px; margin: 0 auto; }
        .catalog-title { font-size: 24px; margin-bottom: 24px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
        .product-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; text-align: center; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--accent-color); }
        .product-img { width: 100%; height: 200px; object-fit: contain; border-radius: 8px; margin-bottom: 16px; background: #222226; }
        .product-name { font-size: 18px; margin-bottom: 8px; }
        .product-cat { color: var(--text-muted); font-size: 14px; margin-bottom: 12px; }
        .product-price { font-size: 22px; font-weight: bold; color: var(--accent-color); margin-bottom: 16px; }
        .buy-btn { width: 100%; padding: 12px; background: var(--accent-color); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .buy-btn:hover { background: #7b2cbf; }
        .empty-msg { color: var(--text-muted); text-align: center; grid-column: 1 / -1; padding: 40px; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">VAPEUP</div>
        <div class="slogan">Преміальний вейп-шоп</div>
    </div>

    <div class="catalog-section">
        <h2 class="catalog-title">Каталог товарів</h2>
        <div class="products-grid" id="catalog-products">
            <!-- Сюда автоматически загружаются товары -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgPbVzw0kXLf006ttDiL9g1CWbNRwJw2s",
            authDomain: "vapeup-ca578.firebaseapp.com",
            projectId: "vapeup-ca578",
            storageBucket: "vapeup-ca578.firebasestorage.app",
            messagingSenderId: "766460083699",
            appId: "1:766460083699:web:8fee400db304053c10e686",
            measurementId: "G-92638T4HZR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const s = document.getElementById('catalog-products');

        if (catalogContainer) {
            onSnapshot(collection(db, "products"), (snapshot) => {
                catalogContainer.innerHTML = "";

                if (snapshot.empty) {
                    catalogContainer.innerHTML = "<p class='empty-msg'>Товарів тимчасово немає в наявності.</p>";
                    return;
                }

                snapshot.forEach((doc) => {
                    const product = doc.data();
                    const imgUrl = product.imageUrl || 'https://placehold.co/250x200';

                    const productHTML = `
                        <div class="product-card">
                            <img src="${imgUrl}" alt="${product.name}" class="product-img">
                            <h3 class="product-name">${product.name}</h3>
                            <p class="product-cat">${product.category}</p>
                            <div class="product-price">${product.price} ₴</div>
                            <button class="buy-btn">Купити</button>
                        </div>
                    `;
                    catalogContainer.insertAdjacentHTML('beforeend', productHTML);
                });
            });
        }
    </script>
</body>
<!-- Подключаем логику витрины магазина как модуль -->
<script type="module" src="./src/shop.js"></script>

</html>
