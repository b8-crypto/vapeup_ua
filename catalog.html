<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPEUP — Преміальний вейп-шоп</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: #141419;
            --panel-hover: #1c1c24;
            --accent-color: #9d4edd;
            --accent-glow: rgba(157, 78, 221, 0.35);
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Неонове фонове світло */
        .neon-blob-1 {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.18) 0%, rgba(11, 11, 15, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }
        .neon-blob-2 {
            position: fixed;
            top: 50%;
            right: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(114, 9, 183, 0.12) 0%, rgba(11, 11, 15, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Шапка сайту на всю ширину без ефекту "в повітрі" */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            padding: 16px 20px; 
            position: sticky;
            top: 0;
            background: rgba(11, 11, 15, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .logo-box { display: flex; flex-direction: column; gap: 2px; }
        .logo { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .logo span { color: var(--accent-color); text-shadow: 0 0 20px var(--accent-glow); }
        .sub-slogan { font-size: 10px; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; }

        /* Кнопка кошика */
        .cart-btn {
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }
        .cart-btn:hover {
            border-color: var(--accent-color);
            background: var(--panel-hover);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .cart-count {
            background: var(--accent-color);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* Каталог */
        .catalog-section { 
            max-width: 1200px; 
            width: 100%;
            margin: 24px auto; 
            padding: 0 16px;
            flex: 1;
        }

        .catalog-header {
            margin-bottom: 24px;
        }

        .catalog-title { 
            font-size: 26px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .catalog-subtitle {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Сітка карток: гарантовано по 2 в рядок на телефонах */
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }
            .catalog-section { padding: 0 24px; margin: 40px auto; }
            .catalog-title { font-size: 32px; }
            .header { padding: 20px 24px; }
        }

        .product-card { 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 14px; 
            text-align: left; 
            transition: all 0.3s ease; 
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .product-card { padding: 20px; border-radius: 16px; }
        }

        .product-card:hover { 
            transform: translateY(-4px); 
            border-color: var(--accent-color); 
            box-shadow: 0 10px 30px var(--accent-glow);
            background: var(--panel-hover);
        }

        .product-img { 
            width: 100%; 
            height: 120px; 
            object-fit: contain; 
            border-radius: 10px; 
            margin-bottom: 12px; 
            background: #0e0e12; 
            padding: 8px;
        }

        @media (min-width: 768px) {
            .product-img { height: 180px; margin-bottom: 16px; }
        }

        .product-cat { 
            color: var(--accent-color); 
            font-size: 11px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px; 
        }

        .product-name { 
            font-size: 14px; 
            font-weight: 600;
            margin-bottom: 10px; 
            color: var(--text-main);
            line-height: 1.3;
        }

        @media (min-width: 768px) {
            .product-name { font-size: 17px; margin-bottom: 14px; }
        }

        .product-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .product-price { 
            font-size: 15px; 
            font-weight: 700; 
            color: var(--text-main); 
        }

        @media (min-width: 768px) {
            .product-price { font-size: 19px; }
        }

        .buy-btn { 
            padding: 8px 12px; 
            background: var(--accent-color); 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: 600; 
            font-size: 12px;
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s; 
        }

        @media (min-width: 768px) {
            .buy-btn { padding: 10px 16px; font-size: 14px; }
        }

        .buy-btn:hover { 
            background: #8537cb; 
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .buy-btn:active { transform: scale(0.96); }

        .empty-msg { 
            color: var(--text-muted); 
            text-align: center; 
            grid-column: 1 / -1; 
            padding: 40px; 
            font-size: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        /* Кошик модалка */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 380px;
            height: 100%;
            background: #121217;
            border-left: 1px solid var(--border-color);
            box-shadow: -10px 0 40px rgba(0,0,0,0.7);
            z-index: 1000;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .cart-modal.open { right: 0; }

        .cart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
        }
        .cart-overlay.open { display: block; }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        .cart-title { font-size: 18px; font-weight: 700; }
        .close-cart { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .close-cart:hover { color: var(--text-main); }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .cart-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-item-info h4 { font-size: 14px; margin-bottom: 2px; }
        .cart-item-info p { color: var(--accent-color); font-weight: 600; font-size: 13px; }
        .remove-item { background: none; border: none; color: #ff5c5c; cursor: pointer; font-size: 12px; }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .checkout-btn {
            width: 100%;
            padding: 12px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .checkout-btn:hover { 
            background: #16a34a;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        /* Футер */
        .footer {
            max-width: 1200px;
            width: 100%;
            margin: 40px auto 0 auto;
            padding: 20px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        @media (min-width: 768px) {
            .footer {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
                padding: 24px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Неонове фонове світло -->
    <div class="neon-blob-1"></div>
    <div class="neon-blob-2"></div>

    <!-- Шапка сайту -->
    <header class="header">
        <div class="logo-box">
            <div class="logo">VAPE<span>UP</span></div>
            <div class="sub-slogan">Преміальний вейп-шоп</div>
        </div>
        <button class="cart-btn" id="open-cart">
            🛒 Кошик <span class="cart-count" id="cart-counter">0</span>
        </button>
    </header>

    <!-- Затемнення фону -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <!-- Модальне вікно кошика -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <div class="cart-title">Ваш кошик</div>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Кошик порожній</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Загалом:</span>
                <span id="cart-total-price">0 ₴</span>
            </div>
            <button class="checkout-btn" id="checkout-btn">Оформити замовлення</button>
        </div>
    </div>

    <!-- Каталог товарів -->
    <main class="catalog-section">
        <div class="catalog-header">
            <h1 class="catalog-title">Каталог товарів</h1>
            <p class="catalog-subtitle">Оберіть свій улюблений девайс чи рідину найвищої якості</p>
        </div>
        
        <div class="products-grid" id="catalog-products">
            <p class="empty-msg">Завантаження каталогу з бази...</p>
        </div>
    </main>

    <!-- Підвал -->
    <footer class="footer">
        <div>© 2026 VAPEUP. Усі права захищені.</div>
        <div>Преміальні девайси</div>
    </footer>

    <!-- Скрипти -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcOmGdPiPTLvgXKnjNzViLkcbxsQgojho",
            authDomain: "vapeup-d7f69.firebaseapp.com",
            databaseURL: "https://vapeup-d7f69-default-rtdb.firebaseio.com",
            projectId: "vapeup-d7f69",
            storageBucket: "vapeup-d7f69.firebasestorage.app",
            messagingSenderId: "1005547278329",
            appId: "1:1005547278329:web:3d9f341f90a338eb93b728"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const catalogContainer = document.getElementById('catalog-products');

        let cart = [];

        if (catalogContainer) {
            onSnapshot(collection(db, "products"), (snapshot) => {
                catalogContainer.innerHTML = "";

                if (snapshot.empty) {
                    catalogContainer.innerHTML = "<p class='empty-msg'>Товарів тимчасово немає в наявності.</p>";
                    return;
                }

                snapshot.forEach((doc) => {
                    const product = doc.data();
                    const productId = doc.id;
                    const imgUrl = product.imageUrl || 'https://placehold.co/250x200/141419/9ba1a6?text=VAPEUP';

                    const productHTML = `
                        <div class="product-card">
                            <img src="${imgUrl}" alt="${product.name}" class="product-img">
                            <div class="product-cat">${product.category || "Рідини"}</div>
                            <h3 class="product-name">${product.name}</h3>
                            <div class="product-footer">
                                <div class="product-price">${product.price} ₴</div>
                                <button class="buy-btn" onclick="addToCart('${productId}', '${product.name.replace(/'/g, "")}', ${product.price})">Купити</button>
                            </div>
                        </div>
                    `;
                    catalogContainer.insertAdjacentHTML('beforeend', productHTML);
                });
            });
        }

        window.addToCart = function(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            updateCartUI();
            openCartModal();
        };

        window.removeFromCart = function(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        };

        function updateCartUI() {
            const counter = document.getElementById('cart-counter');
            const itemsContainer = document.getElementById('cart-items-container');
            const totalPriceEl = document.getElementById('cart-total-price');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            counter.innerText = totalCount;

            if (cart.length === 0) {
                itemsContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Кошик порожній</p>`;
                totalPriceEl.innerText = `0 ₴`;
                return;
            }

            itemsContainer.innerHTML = '';
            let totalSum = 0;

            cart.forEach(item => {
                totalSum += item.price * item.quantity;
                itemsContainer.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>${item.price} ₴ × ${item.quantity}</p>
                        </div>
                        <button class="remove-item" onclick="removeFromCart('${item.id}')">Видалити</button>
                    </div>
                `;
            });

            totalPriceEl.innerText = `${totalSum} ₴`;
        }

        const cartModal = document.getElementById('cart-modal');
        const cartOverlay = document.getElementById('cart-overlay');
        
        function openCartModal() {
            cartModal.classList.add('open');
            cartOverlay.classList.add('open');
        }

        function closeCartModal() {
            cartModal.classList.remove('open');
            cartOverlay.classList.remove('open');
        }

        document.getElementById('open-cart').addEventListener('click', openCartModal);
        document.getElementById('close-cart').addEventListener('click', closeCartModal);
        cartOverlay.addEventListener('click', closeCartModal);

        document.getElementById('checkout-btn').addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Ваш кошик порожній!');
                return;
            }

            let message = "🛍 Нове замовлення з сайту VAPEUP:\n\n";
            let total = 0;

            cart.forEach(item => {
                message += `▪️ ${item.name} — ${item.quantity} шт. (${item.price * item.quantity} ₴)\n`;
                total += item.price * item.quantity;
            });

            message += `\n💰 Загальна сума: ${total} ₴`;

            const telegramUsername = "vapeup_manager";
            const telegramUrl = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;

            window.open(telegramUrl, '_blank');
        });
    </script>
</body>
</html>
