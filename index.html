<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPEUP — Адмін-панель</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: #141419;
            --panel-hover: #1c1c24;
            --accent-color: #9d4edd;
            --accent-glow: rgba(157, 78, 221, 0.35);
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger-color: #ff5c5c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Неонове фонове світло */
        .neon-blob-1 {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(157, 78, 221, 0.18) 0%, rgba(11, 11, 15, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }
        .neon-blob-2 {
            position: fixed;
            top: 50%;
            right: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(114, 9, 183, 0.12) 0%, rgba(11, 11, 15, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Шапка */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
            padding: 16px 20px; 
            background: rgba(11, 11, 15, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }

        .logo-box { display: flex; flex-direction: column; gap: 2px; }
        .logo { font-size: 20px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .logo span { color: var(--accent-color); text-shadow: 0 0 20px var(--accent-glow); }
        .sub-slogan { font-size: 10px; color: var(--text-muted); letter-spacing: 0.8px; text-transform: uppercase; }

        .admin-badge {
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Контейнер */
        .admin-container {
            max-width: 1200px;
            width: 100%;
            margin: 24px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex: 1;
        }

        @media (min-width: 768px) {
            .admin-container { padding: 0 24px; margin: 32px auto; }
        }

        /* Форма додавання товару */
        .form-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            background: #0e0e12;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .submit-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .submit-btn:hover {
            background: #8537cb;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Список товарів в адмінці */
        .products-section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .admin-products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 768px) {
            .admin-products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }
        }

        .admin-product-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .admin-product-img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background: #0e0e12;
            border-radius: 8px;
            padding: 6px;
        }

        .admin-product-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .admin-product-info {
            font-size: 12px;
            color: var(--text-muted);
        }

        .admin-product-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: auto;
        }

        .delete-btn {
            background: rgba(255, 92, 92, 0.15);
            border: 1px solid rgba(255, 92, 92, 0.3);
            color: var(--danger-color);
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            margin-top: 6px;
        }
        .delete-btn:hover {
            background: var(--danger-color);
            color: white;
            box-shadow: 0 0 12px rgba(255, 92, 92, 0.4);
        }

        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            grid-column: 1 / -1;
            padding: 30px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
        }
    </style>
</head>
<body>

    <div class="neon-blob-1"></div>
    <div class="neon-blob-2"></div>

    <header class="header">
        <div class="logo-box">
            <div class="logo">VAPE<span>UP</span></div>
            <div class="sub-slogan">Панель керування</div>
        </div>
        <div class="admin-badge">Admin Mode</div>
    </header>

    <div class="admin-container">
        <!-- Форма додавання -->
        <div class="form-card">
            <h2 class="form-title" id="form-heading">Додати новий товар</h2>
            <form id="product-form">
                <input type="hidden" id="edit-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Назва товару</label>
                        <input type="text" id="p-name" required placeholder="Наприклад: Liquid LUX 30ml">
                    </div>
                    <div class="form-group">
                        <label>Ціна (₴)</label>
                        <input type="number" id="p-price" required placeholder="350">
                    </div>
                    <div class="form-group">
                        <label>Категорія</label>
                        <select id="p-category">
                            <option value="Жидкость">Рідини</option>
                            <option value="Поды">Поди</option>
                            <option value="Картриджі">Картриджі</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Об'єм (для рідин)</label>
                        <select id="p-volume">
                            <option value="">Не вказано / Інше</option>
                            <option value="30">30 мл</option>
                            <option value="15">15 мл</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Лінійка (для рідин)</label>
                        <select id="p-line">
                            <option value="">Не вказано / Інше</option>
                            <option value="LUX">LUX</option>
                            <option value="FP">FP</option>
                            <option value="Mix">Mix</option>
                            <option value="Black">Black</option>
                            <option value="Beat">Beat</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Посилання на зображення (URL)</label>
                        <input type="text" id="p-img" placeholder="https://...">
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" class="submit-btn" id="submit-btn-text">Додати товар</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Список наявних товарів -->
        <div>
            <h2 class="products-section-title">Список товарів у базі</h2>
            <div class="admin-products-grid" id="admin-products-list">
                <p class="empty-msg">Завантаження списку...</p>
            </div>
        </div>
    </div>

    <script type="module">
        // ===== ПЕРЕВІРКА ПАРОЛЯ ПРИ ВХОДІ =====
        const ADMIN_PASSWORD = "vape_secret_2026"; // Змініть цей пароль на власний за бажанням

        const enteredPassword = prompt("Введіть пароль для доступу до адмін-панелі VAPEUP:");

        if (enteredPassword !== ADMIN_PASSWORD) {
            document.body.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #fff; background: #0b0b0f; font-family: sans-serif; text-align: center; padding: 20px;">
                    <h2 style="color: #ff5c5c; margin-bottom: 10px; font-size: 24px;">Доступ заборонено! ❌</h2>
                    <p style="color: #9ba1a6;">Введено невірний пароль.</p>
                </div>
            `;
            throw new Error("Несанкціонований доступ зупинено.");
        }
        // ======================================

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcOmGdPiPTLvgXKnjNzViLkcbxsQgojho",
            authDomain: "vapeup-d7f69.firebaseapp.com",
            databaseURL: "https://vapeup-d7f69-default-rtdb.firebaseio.com",
            projectId: "vapeup-d7f69",
            storageBucket: "vapeup-d7f69.firebasestorage.app",
            messagingSenderId: "1005547278329",
            appId: "1:1005547278329:web:3d9f341f90a338eb93b728"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('product-form');
        const listContainer = document.getElementById('admin-products-list');

        // Отримання товарів в реальному часі
        onSnapshot(collection(db, "products"), (snapshot) => {
            listContainer.innerHTML = "";
            if (snapshot.empty) {
                listContainer.innerHTML = "<p class='empty-msg'>База даних порожня.</p>";
                return;
            }

            snapshot.forEach((documentSnap) => {
                const product = documentSnap.data();
                const id = documentSnap.id;
                const imgUrl = product.imageUrl || 'https://placehold.co/250x200/141419/9ba1a6?text=VAPEUP';
                
                let details = `Категорія: ${product.category || '—'}`;
                if (product.volume) details += ` | ${product.volume} мл`;
                if (product.line) details += ` | ${product.line}`;

                const cardHTML = `
                    <div class="admin-product-card">
                        <img src="${imgUrl}" alt="${product.name}" class="admin-product-img">
                        <h3 class="admin-product-name">${product.name}</h3>
                        <div class="admin-product-info">${details}</div>
                        <div class="admin-product-price">${product.price} ₴</div>
                        <button class="delete-btn" onclick="deleteProduct('${id}')">Видалити</button>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        });

        // Додавання товару
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('p-name').value;
            const price = Number(document.getElementById('p-price').value);
            const category = document.getElementById('p-category').value;
            const volume = document.getElementById('p-volume').value;
            const line = document.getElementById('p-line').value;
            const imageUrl = document.getElementById('p-img').value;

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    price,
                    category,
                    volume,
                    line,
                    imageUrl
                });
                form.reset();
                alert('Товар успішно додано!');
            } catch (error) {
                console.error("Помилка додавання: ", error);
                alert('Помилка при додаванні товару.');
            }
        });

        // Видалення товару
        window.deleteProduct = async function(id) {
            if (confirm('Ви впевнені, що хочете видалити цей товар?')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                } catch (error) {
                    console.error("Помилка видалення: ", error);
                    alert('Не вдалося видалити товар.');
                }
            }
        };
    </script>
</body>
</html>
